 * 本文件已适配标准 Go 1.24+ 构建环境。
 * NDK 版本已升级至 26.3.11579264。
 * 支持两种 AAR 加载模式：
 *   1. 默认：从 android/libs/ 加载预编译 AAR（推荐）
 *   2. 可选：通过 useInternalMake=true 触发 Makefile.simple 自动生成
 */

buildscript {
    ext.kotlin_version = "1.9.22"
    ext.compose_version = "1.5.10"
    ext.accompanist_version = "0.34.0"

    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath("com.ncorti.ktfmt.gradle:plugin:0.17.0")
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

apply plugin: 'kotlin-android'
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.ncorti.ktfmt.gradle'

// ============================================================================
// 构建模式开关
// - useInternalMake = true  : Gradle 自动调用 Makefile.simple 生成 AAR
// - useInternalMake = false : 直接从 libs/ 加载预编译 AAR（默认，推荐）
// ============================================================================
ext {
    useInternalMake = false
}

android {
    def androidApiLevel = providers.gradleProperty("androidApiLevel").get().toInteger()

    // NDK 版本已升级至 26.3.11579264，以兼容 gomobile 官方推荐
    ndkVersion "26.3.11579264"
    compileSdkVersion androidApiLevel

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion androidApiLevel

        // VERSION_CODE_BASE 为分钟级时间戳 * 10，末位保留给平台标识
        // 0 = 手机/平板，1 = Android TV
        versionCode computeVersionCode()
        versionName getVersionProperty("VERSION_LONG")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "boolean", "USE_GOOGLE_DNS_FALLBACK",
            getLocalProperty("tailscale.useGoogleDnsFallback", "true")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        warningsAsErrors true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "$compose_version"
    }

    flavorDimensions "version"
    namespace 'com.tailscale.ipn'

    buildTypes {
        applicationTest {
            initWith debug
            manifestPlaceholders.leanbackRequired = isTV()
            buildConfigField "String", "GITHUB_USERNAME",
                "\"" + getLocalProperty("githubUsername", "") + "\""
            buildConfigField "String", "GITHUB_PASSWORD",
                "\"" + getLocalProperty("githubPassword", "") + "\""
            buildConfigField "String", "GITHUB_2FA_SECRET",
                "\"" + getLocalProperty("github2FASecret", "") + "\""
        }
        debug {
            manifestPlaceholders.leanbackRequired = isTV()
        }
        release {
            manifestPlaceholders.leanbackRequired = isTV()
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    testBuildType "applicationTest"
}

dependencies {
    // 从 libs 目录加载预编译 AAR（默认方式）
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // Android 核心库
    implementation "androidx.core:core:1.13.1"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Kotlin 依赖
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation 'junit:junit:4.13.2'
    implementation 'androidx.room:room-ktx:2.6.1'
    runtimeOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    // Compose UI
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-core:1.7.3'
    implementation "androidx.compose.ui:ui:1.7.3"
    implementation "androidx.compose.ui:ui-tooling:1.7.3"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation "com.google.accompanist:accompanist-permissions:$accompanist_version"
    implementation "com.google.accompanist:accompanist-systemuicontroller:$accompanist_version"
    implementation "androidx.core:core-splashscreen:1.1.0-rc01"
    implementation "androidx.compose.animation:animation:1.7.4"

    // Navigation
    def nav_version = "2.8.5"
    implementation "androidx.navigation:navigation-compose:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // 工具库
    implementation("io.coil-kt:coil-compose:2.6.0")
    implementation("com.google.zxing:core:3.5.1")
    implementation("com.patrykandpatrick.vico:compose:1.15.0")
    implementation("com.patrykandpatrick.vico:compose-m3:1.15.0")

    // Tailscale AAR（通过 flatDir 加载）
    implementation ':libtailscale@aar'

    // Android 集成测试
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.2.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'dev.turingcomplete:kotlin-onetimepassword:2.4.0'
    androidTestImplementation 'commons-codec:commons-codec:1.16.1'

    // 单元测试
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'

    debugImplementation("androidx.compose.ui:ui-tooling")
    implementation("androidx.compose.ui:ui-tooling-preview")
}

// ============================================================================
// 可选：当 useInternalMake == true 时，自动调用 Makefile.simple 生成 AAR
// ============================================================================
if (useInternalMake) {
    task generateAar(type: Exec) {
        description = '使用 Makefile.simple 生成 libtailscale.aar'
        workingDir rootProject.projectDir
        commandLine 'make', '-f', 'Makefile.simple', 'aar'
    }
    preBuild.dependsOn generateAar
}

// ============================================================================
// 辅助函数
// ============================================================================

def getLocalProperty(String key, String defaultValue) {
    try {
        Properties properties = new Properties()
        properties.load(project.file('local.properties').newDataInputStream())
        return properties.getProperty(key) ?: defaultValue
    } catch (Throwable ignored) {
        return defaultValue
    }
}

def getVersionProperty(String key) {
    // tailscale.version 由 Makefile 生成，格式兼容 Properties 文件
    def versionProps = new Properties()
    versionProps.load(project.file('../tailscale.version').newDataInputStream())
    return versionProps.getProperty(key).replaceAll('^"|"$', '')
}

def computeVersionCode() {
    def baseProperty = project.findProperty('VERSION_CODE_BASE')
    // 直接 Gradle 调用时（非 Makefile 触发），使用当前时间作为基数
    def base = baseProperty != null
            ? baseProperty as long
            : (System.currentTimeMillis() / 60000L) * 10L
    def platform = isTV() ? 1 : 0
    return (base + platform) as int
}

def isTV() {
    return project.findProperty('PLATFORM')?.toString() == 'tv'
}
